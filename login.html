<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="res/css/style.css">
    <title>Login</title>
</head>

<body>
    <header class="header">
        <nav>
            <a class="nav-link" href="index.html">Home</a>
        </nav>  
        <a
            class="login-link"  
            href="login.html" >

            <svg 
            xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle profile-icon" viewBox="0 0 16 16">
            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
            </svg>
        </a>   
    </header>
    <main class="login-main">
        <section class="login-box">
            <h1>Welcome to PostIt</h1>
            <a class="acc-action"
            href="#">Create an account</a>
            <p class="pre-formated">
                or
                Please log in</p>
            <form class="login-form" action="index.html">
                <input class="login-input" type="email" name="email" id="email" placeholder="Email" required><br>
                <input class="login-input" type="password" name="password" id="password" placeholder="Password" required><br>
                <button class="login-button" type="submit" >Log in</button>

                <!-- <input class="login-button" type="submit" value="Log in"><br> -->
                <!-- <a  class="login-button"
                     href="index.html">Log in</a> -->
            </form>
            <a class="acc-action"
             href="#">Forgot password</a>
        </section>
    </main>
</body>
</html>
