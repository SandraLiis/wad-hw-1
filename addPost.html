<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="res/css/style.css">
    <title>Add post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">  
</head>

<body>
    <header class="header">
        <div class="nav-left">
            <a class="add-post-nav-link" href="addPost.html">
                <svg class="plus-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                </svg>
                <span class="add-post-text">Add post</span>
            </a>
        </div>

        <a class="logo-link" href="index.html">ComMITS</a>

        <div class="nav-right">
            <a class="login-link" href="login.html">
                <svg class="profile-icon bi bi-person-circle" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                </svg>
                <span class="account-text">Account</span>
            </a>
        </div>
    </header>

     <main class="add-post-main">
    
        <section class="add-post-box">
            <h1>ADD POST</h1>

            <form class="add-post-form" action="index.html">
                <label for="post-body">
                    Post body
                </label>
                <textarea id="post-body"
                          name="post-body"
                          placeholder="You can write something here.."></textarea>

                <label for="post-file">
                    Select file
                </label>
                <input id="post-file" name="post-file" type="file">

                <button class="post-button" type="submit">
                    Create post
                </button>
            </form>
        </section>

    </main>

</body>
</html>
